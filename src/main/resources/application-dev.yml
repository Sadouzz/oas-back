spring:
    application:
        name: facturation
    datasource:
        url: ${DATABASE_URL}
        username: ${DATABASE_HOSTNAME}
        password: ${DATABASE_PASSWORD}
        driver-class-name: org.postgresql.Driver

    jpa:
        hibernate:
            ddl-auto: update
        show-sql: true
        database-platform: org.hibernate.dialect.PostgreSQLDialect


app:
    jwt:
        secret: ${JWT_SECRET}
        expiration: 3600000
    cors:
        allowed-origins: "http://localhost:4200,http://localhost:32235,http://localhost:5173,http://10.10.10.51,https://oas-front.vercel.app"

server:
    port: 9090

logging:
    level:
        org.springframework.security: TRACE