spring:
    application:
        name: facturation
    datasource:
        url: ${DATABASE_URL}
        username: ${DATABASE_HOSTNAME}
        password: ${DATABASE_PASSWORD}
        driver-class-name: org.postgresql.Driver

    jpa:
        hibernate:
            ddl-auto: update
        show-sql: true
        database-platform: org.hibernate.dialect.PostgreSQLDialect

    mail:
        host: smtp.gmail.com
        port: 587
        username: ${MAIL_USERNAME:serviceitoas@gmail.com}
        password: ${MAIL_PASSWORD:}
        properties:
            mail:
                smtp:
                    auth: true
                    starttls:
                        enable: true

app:
    jwt:
        secret: ${JWT_SECRET}
        expiration: 3600000
    cors:
        allowed-origins: "http://localhost:4200,http://localhost:32235,http://localhost:5173,http://10.10.10.51,https://oas-front.vercel.app"
    cloudinary:
        cloud-name: ${CLOUDINARY_CLOUD_NAME}
        api-key: ${CLOUDINARY_API_KEY}
        api-secret: ${CLOUDINARY_API_SECRET}
    frontend-url: ${FRONTEND_URL:http://localhost:4200}

server:
    port: 9090

management:
    health:
        mail:
            enabled: false

logging:
    level:
        org.springframework.security: TRACE