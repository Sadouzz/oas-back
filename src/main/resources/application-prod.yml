spring:
  application:
    name: facturation
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME:${DATABASE_HOSTNAME:}}
    password: ${DATABASE_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000
          ssl:
            trust: "*"

app:
  cookie:
    secure: ${COOKIE_SECURE:true}
    same-site: ${COOKIE_SAME_SITE:None}
  jwt:
    secret: ${JWT_SECRET}
    expiration: 21600000
    refresh-expiration: 604800000
  cors:
    allowed-origins: ${CORS_ORIGINS:https://oas-senegal.com,https://www.oas-senegal.com,https://api.oas-senegal.com}
  cloudinary:
    cloud-name: ${CLOUDINARY_CLOUD_NAME}
    api-key: ${CLOUDINARY_API_KEY}
    api-secret: ${CLOUDINARY_API_SECRET}

server:
  port: ${PORT:9090}
  forward-headers-strategy: framework

# Actuator & Prometheus monitoring
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: when-authorized
  health:
    redis:
      enabled: false
    mail:
      enabled: false
  metrics:
    tags:
      application: facturation
