spring:
  datasource:
    url: jdbc:h2:mem:facturation_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;NON_KEYWORDS=YEAR,VALUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
  mail:
    host: localhost
    port: 2525

app:
  jwt:
    secret: test-jwt-secret-key-minimum-32-characters-long
    expiration: 21600000
    refresh-expiration: 604800000
  cors:
    allowed-origins: "http://localhost:4200"
  cloudinary:
    cloud-name: test
    api-key: test
    api-secret: test
